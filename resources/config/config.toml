# ageAPIServer configuration. Every key can be overridden with an environment
# variable (prefix AGEAPISERVER_, underscore as separator) or a flag
# (--section.key). Keys are PascalCase, like the sibling ageLANServer.

[Server]
Addr = ":8080"
ReadHeaderTimeout = "5s"
IdleTimeout = "60s"
MaxBodyBytes = 1048576
# Empty means the download URL is rebuilt from the request, honouring the
# X-Forwarded-Proto and X-Forwarded-Host headers of a reverse proxy.
PublicBaseURL = ""

# HTTPS. The listener serves plain HTTP by default, because the game clients
# speak it; either terminate TLS here or let a proxy in front do it.
#
#   off   - plain HTTP (default)
#   on    - this process terminates TLS with the pair below
#   proxy - an external HTTPS terminator forwards to this process: absolute
#           URLs are https unless X-Forwarded-Proto says otherwise
[Server.TLS]
Mode = "off"

# Folder holding cert.pem and key.pem. Empty means resources/certificates next
# to the executable, created on first use. The pair is never generated here:
# bring your own (a CA issued one, or any self-signed pair your clients trust).
Folder = ""

# Overrides of the file names inside Folder.
Cert = ""
Key = ""

[DB]
Path = "ageAPIServer.db"
BusyTimeoutMs = 5000
MaxOpenConns = 1

[Log]
Enabled = true
Level = "info"
File = "ageAPIServer.log"

[Session]
TTL = "720h"
CookieName = ".AgeOfEmpiresServices"
# Lax works while the website and the API share a registrable domain. A
# cross-site deployment needs None (and HTTPS).
SameSite = "Lax"

[CORS]
AllowedOrigins = ["https://www.ageofempires.com"]
AllowCredentials = true
MaxAge = "600s"

[Pagination]
# page: start is a 1-based page number (what the captures support).
# offset: start is a row offset.
Base = "page"
DefaultCount = 30
MaxCount = 20000

[Storage]
# Where Publish writes the mod archive and its screenshots. Empty rejects any
# publish that carries a file.
UploadDir = "uploads"

# CONFIGURING CUSTOM FILES
# Serves the /api/MatchContent endpoints used by the game to upload and
# download multiplayer savegames and replays. Without it, restoring a saved
# multiplayer game fails with "Failed to upload/download custom files".
[MatchContent]

# Whether to enable the endpoints. When disabled the routes answer 404.
Enabled = true

# Folder where the files are stored. "auto" means
# <TEMP>/ageAPIServer/custom-files (Unix: /tmp/ageAPIServer/custom-files).
Folder = "auto"

# Maximum size of a single file in bytes. Long matches and custom content can
# make a savegame several MB. The global [Server] MaxBodyBytes cap is skipped
# for this prefix, so this is the limit that applies.
MaxFileSize = 33554432

# Maximum accumulated size in bytes. When exceeded, the oldest files are
# evicted first.
MaxTotalSize = 268435456

# How long a file is kept since its upload. Accepts Go durations (12h, 30m,
# 1h30m). Files are also purged at startup if older than this. 0 keeps them
# until they are evicted.
Expiry = "12h"
