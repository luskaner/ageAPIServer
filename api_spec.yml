paths:
  # Games
  /api/v4/mods/Games:
    get:
      tags:
        - Games
      summary: Get list of supported games
      description: Returns all games that support mods
      operationId: getGames
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Tags
  /api/v4/mods/Tags:
    get:
      tags:
        - Tags
      summary: Get all mod tags/types
      description: Returns all mod types grouped by game. The optional `game`
        query parameter narrows the catalog; without it every game's tags are
        returned.
      operationId: getTags
      parameters:
        - name: game
          in: query
          required: false
          schema:
            type: integer
          description: Game title id whose tags are returned
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModTagList'
        '400':
          description: game is not an integer
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Featured
  /api/v4/mods/Featured:
    post:
      tags:
        - Featured
      summary: Get featured mods
      description: |
        Returns featured mods for a specific game: the AOM client sends only
        {"game":1001} and the resolved echo answers sort popular and count 10
        with creator null; the website sends sort (recentpopular), count (3)
        and filters explicitly and echoes them as sent. The rows are the
        status-5 mods ("Featured") of the game.
      operationId: getFeaturedMods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturedModsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Mods - Find (v4)
  /api/v4/Mods/Find/:
    post:
      tags:
        - Mods
      summary: Search mods (v4)
      description: Search for mods with various filters and sorting options
      operationId: findModsV4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindModsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Mods - Detail (v4)
  /api/v4/Mods/Detail/{modId}:
    get:
      tags:
        - Mods
      summary: Get mod details (v4)
      description: Returns detailed information about a specific mod
      operationId: getModDetailV4
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
          description: Mod ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          description: Invalid modId
        '401':
          description: Unauthorized
        '404':
          description: Mod not found (RFC 9110 ProblemDetails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error

  # Mods - Installed (v4)
  /api/v4/Mods/Installed/:
    post:
      tags:
        - Mods
      summary: Get installed mods (v4)
      description: Returns list of mods installed by the current user
      operationId: getInstalledModsV4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstalledModsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Mods - Subscribe (v4)
  /api/v4/Mods/Subscribe/{modId}:
    get:
      tags:
        - Mods
      summary: Subscribe to mod (v4)
      description: Subscribe to a mod and get download URL
      operationId: subscribeModV4
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
          description: Mod ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeResponse'
        '400':
          description: Invalid modId
        '401':
          description: Unauthorized
        '404':
          description: Mod not found
        '500':
          description: Internal server error

  # Mods - Unsubscribe (v4)
  /api/v4/Mods/Unsubscribe/{modId}:
    get:
      tags:
        - Mods
      summary: Unsubscribe from mod (v4)
      description: Unsubscribe from a mod
      operationId: unsubscribeModV4
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
          description: Mod ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResponse'
        '400':
          description: Invalid modId
        '401':
          description: Unauthorized
        '404':
          description: Mod not found
        '500':
          description: Internal server error

  # Mods - Rate (v4)
  /api/v4/Mods/Rate/:
    post:
      tags:
        - Mods
      summary: Rate a mod (v4)
      description: Submit a rating for a mod (1-5 stars)
      operationId: rateModV4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateModRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateModResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Mod not found
        '500':
          description: Internal server error

  # Mods - Download (v4)
  /api/v4/Mods/Download/{modId}/:
    get:
      tags:
        - Mods
      summary: Get mod download URL (v4)
      description: Returns the direct download URL for a mod file
      operationId: downloadModV4
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
          description: Mod ID
      servers:
        - url: https://api-dr.ageofempires.com
          description: Download redirect server
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '400':
          description: Invalid modId
        '401':
          description: Unauthorized
        '404':
          description: Mod not found
        '500':
          description: Internal server error

  /api/v4/mods/Download/{modId}/file:
    get:
      tags:
        - Mods
      summary: Download the mod archive (v4)
      description: |
        Streams the stored archive with an attachment Content-Disposition. It is
        the target of the downloadUrl that Subscribe and Download hand to the
        client, requires authentication, and does not touch the download
        counter (the JSON endpoint owns it).
      operationId: downloadModFileV4
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
          description: Mod ID
      responses:
        '200':
          description: The raw archive
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '404':
          description: Mod not found or mod has no file
        '500':
          description: No upload directory configured, or internal server error

  # Media
  /api/v4/mods/Image/{name}:
    get:
      tags:
        - Media
      summary: Get a stored mod screenshot
      description: |
        Serves the screenshots Publish stored under UploadDir. Anonymous: a
        thumbnail carries no user data and the game client may fetch it before
        it authenticates. The path parameter is reduced to its base name, so a
        traversal never escapes UploadDir.
      operationId: getModImage
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Stored image file name
      responses:
        '200':
          description: The image bytes
        '404':
          description: Image not found or no upload directory configured

  # Mods - Detail (v1, AOE2)
  /api/v1/Mods/Detail/:
    post:
      tags:
        - Mods
      summary: Get mod details (v1, AOE2)
      description: Returns detailed information about a specific mod (legacy v1 endpoint for AOE2)
      operationId: getModDetailV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - modid
              properties:
                modid:
                  description: Mod ID; clients send either an integer or its string form
                  oneOf:
                    - type: integer
                    - type: string
                game:
                  type: integer
                  description: Optional; the capture sends only modid and the value is unused
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyDetail'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Mod not found (ErrorResponse)
        '500':
          description: Internal server error

  # Mods - FindAsUser (v1, AOE2)
  /api/v1/Mods/FindAsUser/:
    post:
      tags:
        - Mods
      summary: Search mods (v1, AOE2)
      description: Search for mods with various filters (legacy v1 endpoint for AOE2)
      operationId: findModsAsUserV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindModsRequestV1'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyModList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Mods - Installed (v1, AOE2)
  /api/v1/Mods/Installed/:
    post:
      tags:
        - Mods
      summary: Get installed mods (v1, AOE2)
      description: Returns list of mods installed by the current user (legacy v1 endpoint for AOE2)
      operationId: getInstalledModsV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindModsRequestV1'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyModList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Mods - My (v1, AOE2)
  /api/v1/Mods/My/:
    post:
      tags:
        - Mods
      summary: Get my mods (v1, AOE2)
      description: Returns mods created by the current user (legacy v1 endpoint for AOE2)
      operationId: getMyModsV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyModsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyModList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # Mods - Flag (v1, AOE2)
  /api/v1/Mods/Flag/:
    post:
      tags:
        - Mods
      summary: Flag a mod (v1, AOE2)
      description: Report/flag a mod for review (legacy v1 endpoint for AOE2)
      operationId: flagModV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagModRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Mod not found
        '500':
          description: Internal server error

  # Mods - Install (v1, AOE2)
  /api/v1/Mods/Install/:
    post:
      tags:
        - Mods
      summary: Install a mod (v1, AOE2)
      description: Install a mod for the current user (legacy v1 endpoint for AOE2)
      operationId: installModV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallModRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallModResponse'
        '400':
          description: Bad request
        '401':
