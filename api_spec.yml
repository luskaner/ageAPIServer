externalDocs:
  description: Repository, README and deployment notes.
  url: https://github.com/luskaner/ageAPIServer
servers:
  - url: https://api.ageofempires.com
    description: API host the clients are configured to reach; point it at this deployment.
  - url: https://api-dev.ageofempires.com
    description: Development host; the wiki documents it for /Poll only.
  - url: https://api-dr.ageofempires.com
    description: Download/redirect host used by every Age of Empires IV mod request and by the downloads of all clients.
security:
  - SteamAuth: []
  - XblAuth: []
  - WebSession: []
tags:
  - name: Games
    description: The titles the mods API serves.
  - name: Tags
    description: Mod types/tags of the catalogue Publish validates `modTags` against.
  - name: Featured
    description: Featured mods, served from the status-5 rows of a game.
  - name: Mods
    description: v4 search, detail, user state and mod management.
  - name: Legacy
    description: The legacy v1 surface of the AOE2 client, with its own row render.
  - name: Polls
    description: In-game polls.
  - name: Moderation
    description: The text moderation probe.
  - name: Media
    description: Mod screenshots stored by Publish (implementation endpoint).
  - name: MatchContent
    description: Multiplayer savegame and replay exchange (implementation endpoint).
  - name: Ops
    description: Operational probes (implementation endpoint).
components:
  securitySchemes:
    SteamAuth:
      type: http
      scheme: bearer
      bearerFormat: "Steam1.0"
      description: Steam authentication token sent by the game clients
    XblAuth:
      type: http
      scheme: bearer
      bearerFormat: "XBL3.0"
      description: |
        Xbox token of the Microsoft Store clients, sent as
        `XBL3.0 x=<puid>;<XToken>`. The AOE3 capture carries Steam for the
        read endpoints and this for `My`, `Publish` and `Delete` in the same
        session.
    WebSession:
      type: apiKey
      in: cookie
      name: .AgeOfEmpiresServices
      description: Website session cookie used by www.ageofempires.com instead of a Steam token
  parameters:
    GameQuery:
      name: game
      in: query
      required: false
      schema:
        type: integer
        enum: [1, 2, 3, 4, 1001]
      description: Game title id whose catalogue is returned; absent means every game.
    Comp:
      name: comp
      in: query
      required: false
      schema:
        type: string
        enum: [block, blocklist]
        default: block
      description: Upload stage. An absent or empty value behaves like `block`.
    BlockId:
      name: blockid
      in: query
      required: false
      schema:
        type: string
        default: "00000000"
      description: Azure block id of a `comp=block` request; empty means `00000000`.
    ModIdQuery:
      name: modId
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Mod the uploaded blocks belong to.
  headers:
    RetryAfter:
      description: Seconds until the next request is allowed.
      schema:
        type: integer
        minimum: 1
    ContentDisposition:
      description: '`attachment; filename="<stored name>"`.'
      schema:
        type: string
    ETag:
      description: Quoted MD5 digest of the payload.
      schema:
        type: string
    ContentMD5:
      description: Base64 MD5 digest of the payload (RFC 1864).
      schema:
        type: string
    LastModified:
      description: Upload time of the payload, in HTTP date format.
      schema:
        type: string
        format: http-date
  responses:
    BadRequest:
      description: The request could not be parsed, or a required or invalid field was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                errorCode: 400
                errorMessage: invalid body
    Unauthorized:
      description: Missing or unknown credential, or the caller is not the creator of the mod.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                errorCode: 900
                errorMessage: Access Denied - User not authenticated.
                isLoggedOn: false
    NotFound:
      description: The resource does not exist, or the route is disabled (MatchContent store off).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: 404
                errorMessage: not found
    ProblemNotFound:
      description: RFC 9110 problem document returned by the v4 Detail of a deleted mod.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            problem:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Not Found
                status: 404
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    InternalServerError:
      description: The store failed, or the deployment is missing the configuration the route needs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              value:
                errorCode: 500
                errorMessage: internal error
    TooManyRequests:
      description: The per-IP MatchContent rate limit is exhausted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                errorCode: 429
                errorMessage: too many requests
    PayloadTooLarge:
      description: The MatchContent payload exceeds `MatchContent.MaxFileSize` (the body keeps errorCode 400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tooLarge:
              value:
                errorCode: 400
                errorMessage: content too large
  examples:
    GameList:
      summary: Two of the five supported titles
      value:
        - gameTitleId: 2
          gameTitleName: Age of Empires II DE
          gameVersion: null
        - gameTitleId: 1001
          gameTitleName: "Age of Mythology: Retold"
          gameVersion: null
    TagList:
      summary: Two mod types of one game
      value:
        - modTypeId: 15
          modTypeName: Random Maps
          gameTitleId: 2
        - modTypeId: 26
          modTypeName: Other
          gameTitleId: 2
    ModListPage:
      summary: One page of the resolved filter
