  /api/v1/Mods/Create/:
    post:
      tags: [Legacy]
      summary: Create or update a mod (v1)
      description: |
        The multipart form the AOE2 client builds: `modFiles` is the archive,
        `modImages` the screenshots paired with `ImageMetaData` by file name,
        and the scalar fields spell `ModName`, `GameTitleId`, `ModType`,
        `Description`, `modVisibility` and `ChangeList` (read
        case-insensitively). An `imageFileSize` of the metadata entry is a
        string.

        A body carrying `ModId` of the caller's mod UPDATES it instead and
        answers the same id: the AOE2 client re-publishes through this endpoint
        after an upload. The update keeps the stored images when the body only
        re-declares their identity (imageId plus absolute URLs, no file
        parts), and otherwise behaves like Publish (the +0.1 version tick, the
        `updateAvailable` flip and the changeList rewrite).

        Create side effects pinned by the capture: status Published (2); the
        stored `modVersion` is zero (only the v4 Detail renders 1.1); the
        description is mirrored into `modDescription`; the creator counts as
        the first download and install; and without explicit tags the mod gets
        the auto tag 26 ("Other").
      operationId: createModV1
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateModRequestV1'
      responses:
        '200':
          description: The id of the created or updated mod.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModIdResult'
              examples:
                stored:
