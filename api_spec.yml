      description: Returns reviews for a specific mod
      operationId: getModReviews
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - modId
              properties:
                modId:
                  type: string
                  description: Mod ID (as string)
                page:
                  type: integer
                  default: 1
                  minimum: 1
                count:
                  type: integer
                  default: 5
                  minimum: 1
                  maximum: 100
                ratingNum:
                  type: integer
                  description: Filter by rating number
                ratingLabel:
                  type: string
                  description: Rating label filter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuationToken:
                    type: string
                    nullable: true
                  reviews:
                    type: array
                    items:
                      type: object
                      properties:
                        helpfulNegative:
                          type: integer
                        helpfulnessVotes:
                          type: integer
                        helpfulPositive:
                          type: integer
                        isInstalled:
                          type: boolean
                        itemId:
                          type: string
                          nullable: true
                        itemVersion:
                          type: string
                        locale:
                          type: string
                          nullable: true
                        rating:
                          type: integer
                        reviewerId:
                          type: string
                          nullable: true
                        reviewId:
                          type: string
                          nullable: true
                        reviewText:
