  # Mods - Create (v1, AOE2)
  /api/v1/Mods/Create/:
    post:
      tags:
        - Mods
      summary: Create a mod (v1, AOE2)
      description: |
        Create a mod from the multipart form the AOE2 client builds. The
        answer carries the new id in resultValue with resultKey "ModId".
        Without explicit tags the mod gets "Other" (26). The creator counts
        as its first download and install, and the status is Published (2)
        whatever the visibility.
        A body carrying ModId of the caller's mod updates it instead and
        answers the same id - the AOE2 client re-publishes through this
        endpoint after an upload; the re-declared image identity (imageId
        with absolute URLs and no file parts) keeps the stored images as
        they are.
      operationId: createModV1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateModRequestV1'
      responses:
        '200':
          description: Successful response with the new mod id
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: integer
                    example: 0
                  errorMessage:
                    type: string
                    example: "0"
                  resultKey:
                    type: string
                    example: ModId
                  resultValue:
                    type: string
                    description: The id of the created or updated mod
                    example: "593779"
                  resultJson:
                    nullable: true
        '400':
          description: Bad request
        '401':
          description: Unauthorized, or the caller does not own the mod being updated
        '404':
          description: Mod not found
        '500':
          description: Internal server error

