  # ---------------------------------------------------------------------------
  # MatchContent (implementation endpoints)
  # ---------------------------------------------------------------------------

  /api/MatchContent/:
    post:
      tags: [MatchContent]
      summary: Upload a multiplayer savegame or replay
      description: |
        Streams the multipart payload to disk and stores it under the match id.
        The parts are:

        * `fileContent` - the savegame or replay, with its original file name.
          The extension must be empty (the file is then stored as
          `<matchId>.bin`) or one of the allowlisted savegame, replay and
          scenario extensions of the supported titles; the size is bounded by
          `MatchContent.MaxFileSize`.
        * `matchId` - the positive 32-bit id the file is stored under.

        Unknown parts are discarded. The answer is JSON with `isError`, which
        the AOE2 DE client requires. Anonymous. Answers 404 when the match
        content store is disabled. When `MatchContent.RateLimitPerMinute` is
        set, the per-IP bucket wraps all three MatchContent routes and can
        answer 429 with `Retry-After`.
      operationId: uploadMatchContent
      x-fidelity: Own
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fileContent, matchId]
              properties:
                fileContent:
                  type: string
                  format: binary
                matchId:
                  type: integer
                  format: int32
                  minimum: 1
      responses:
        '200':
          description: The file was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchContentUploadResponse'
              examples:
                stored:
                  $ref: '#/components/examples/MatchContentUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/MatchContent/{matchId}:
    get:
      tags: [MatchContent]
      summary: Get the metadata of a stored match file
      description: |
        Returns the JSON metadata the AOE2 DE client reads before it downloads
        the payload: `fileName`, `fileSize`, `filePath` (the absolute URL of the
        payload route, with the MD5 digest) and `fileCRC`. The answer carries
        `Cache-Control: no-store`. Anonymous; answers 404 when the store is
        disabled or the id is unknown.
      operationId: getMatchContent
      x-fidelity: Own
      security: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Match id the file was uploaded under.
      responses:
        '200':
          description: The metadata of the stored file.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                examples: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchContentMetadataResponse'
              examples:
                stored:
                  $ref: '#/components/examples/MatchContentMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/MatchContent/{matchId}/file/{hash}:
    get:
      tags: [MatchContent]
      summary: Download a stored match file
      description: |
        Streams the payload with the stored content type and length, the
        `Content-Disposition` of the stored name, its `Last-Modified`, the
        quoted MD5 `ETag` and the base64 `Content-MD5`. The `hash` must equal
        the stored MD5 digest, so stale metadata never downloads a replacement
        uploaded under the same id. Anonymous.
      operationId: downloadMatchContent
      x-fidelity: Own
      security: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Match id the file was uploaded under.
        - name: hash
          in: path
          required: true
          schema:
            type: string
          description: MD5 digest of the stored payload, as returned in `filePath`.
      responses:
        '200':
          description: The raw payload.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
            Content-MD5:
              $ref: '#/components/headers/ContentMD5'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------------------
  # Ops: local routes of this server, not part of the upstream service.
  # ---------------------------------------------------------------------------

  /test:
    get:
      tags: [Ops]
      summary: Liveness probe
      description: |
        Local endpoint of this server; upstream does not have it. Pings the
        database. Answers {"status":"ok"} on success and
        {"status":"unavailable"} with 503 when the database is unreachable.
        Anonymous.
      operationId: getTest
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: Database reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  $ref: '#/components/examples/HealthOK'
        '503':
          description: Database unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unavailable:
                  value:
                    status: unavailable

  /cacert.pem:
    get:
      tags: [Ops]
      summary: The certificate this server terminates TLS with
      description: |
        Local endpoint of this server; upstream does not have it. Serves the
        PEM certificate of the HTTPS listener (`Server.TLS.Cert`, or
        `<folder>/cert.pem`) byte for byte, so a client can be made to trust
        this server. Anonymous.

        With `Server.TLS.Mode` off or proxy this process does not terminate TLS
        itself, so it has no certificate of its own to serve and the route
        answers the plain-text 404 of `http.NotFound`: in proxy mode the pair
        belongs to the reverse proxy.
      operationId: getCACert
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: The certificate, byte for byte.
          content:
            application/x-pem-file:
              schema:
                type: string
        '404':
          description: TLS is not terminated by this process, or the file is gone.
          content:
            text/plain:
              schema:
                type: string
                examples: [404 page not found]

  /openapi.yml:
    get:
      tags: [Ops]
      summary: The served API description
      description: |
        Local endpoint of this server; upstream does not have it. Serves this
        very document, embedded in the binary, so a client generator or a proxy
        can read it from the running server without the release archive. The
        body is the file byte for byte, under application/yaml. Anonymous.
      operationId: getOpenApiSpec
      x-fidelity: Own
      security: []
      responses:
        '200':
          description: The OpenAPI document, byte for byte.
          content:
            application/yaml:
              schema:
                type: string
