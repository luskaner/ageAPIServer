  # Publish a mod
  /api/v4/mods/Publish:
    post:
      tags:
        - Mods
      summary: Publish or update a mod
      description: |
        Creates a mod when modId is absent and updates it when modId is present.
        The body is multipart/form-data because it carries the archive and the
        screenshots. modStatusId is always the published 2, which is what the
        created mod of the AOE2 captures answers and every live detail shows,
        whatever the visibility.
      operationId: publishMod
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - gameTitleId
                - modName
              properties:
                modId:
                  type: integer
                  description: Present only when updating an existing mod
                gameTitleId:
                  type: integer
                modType:
                  type: integer
                  description: |-
                    Mod type id, stored as sent: the catalog of the game is not
                    consulted, so an id the Tags catalog does not sell still
                    attaches (the AOE4 client uploads type 6 "Extension" for
                    game 4, whose catalog stops at 5, and its Detail answers
                    modType Extension). A create without tags also gets the
                    auto tag 26 "Other" in modTagIds, whose name is empty when
                    the catalog of the game has no 26.
                modName:
                  type: string
                  description: |-
                    The AOE4 client sends a JSON localization map such as
                    {"es":"moddisplayname"}; the server stores its plain
                    string (the en entry wins, otherwise the first entry in
                    the order the request wrote).
                description:
                  type: string
                  description: Same JSON localization map handling as modName.
                changeList:
                  type: string
                  description: |-
                    Stored prefixed with the mod-update-date header of the day
                    when it is not empty. An update publish without one bumps
                    the stored modVersion by 0.1 (the AOE4 capture moves 1.1
                    to 1.2) and flips updateAvailable for subscribers of the
                    previous version.
                modVisibility:
                  type: string
                  enum: [Public, Private, Unlisted]
                  default: Public
                  description: Read case-insensitively; the AOE4 client sends lowercase.
                modDiscussion:
                  type: boolean
                  default: false
                modTags:
                  type: array
                  description: Repeated field or one comma-separated value
                  items:
                    type: integer
                ImageMetaData:
                  type: string
                  description: |
                    JSON array of {imageId, displayIndex, imageName,
                    imageThumbnail}. An entry is paired with the modImages part
                    of the same file name; an entry without an upload keeps the
                    thumbnail the client sent.
                modImages:
                  type: array
                  items:
                    type: string
                    format: binary
                modFiles:
                  type: string
                  format: binary
      responses:
        '200':
          description: The mod was stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: integer
                    example: 0
                  errorMessage:
                    type: string
                    example: "0"
                  resultKey:
                    type: string
                    example: ModId
                  resultValue:
                    type: string
                    description: The id of the created or updated mod
                    example: "583325"
                  resultJson:
                    type: string
                    nullable: true
        '400':
          description: Bad request (missing gameTitleId or modName, invalid visibility, unreadable multipart body or ImageMetaData)
        '401':
          description: Unauthorized, or the caller is not the creator
        '404':
          description: Mod not found
        '500':
          description: Internal server error

  /api/v4/mods/CheckAndPublishFile:
    put:
      tags:
        - Mods
      summary: Upload the mod archive (Azure Block Blob style)
      description: |
        The upload the AOE4 client performs right after Publish. One request
        per block and a final commit, both answering the bare JSON literal
        true:

        * `?comp=block&blockid=00000000&modId=N` - the body is the raw file
          bytes (application/octet-stream). The block is staged under
          UploadDir/blocks/<modId>/; nothing visible changes yet.
        * `?comp=blocklist&modId=N` - the body is
          <?xml version="1.0" encoding="utf-8"?><BlockList><Latest>00000000</Latest></BlockList>.
          The commit concatenates the listed blocks in order, stores them as
          the mod file (fileUrl, fileCRC, modFileSize and modDiskSize equal,
          as the capture shows) and stamps lastUpdate.

        The commit requires the caller to own the mod; a missing mod answers
        the ProblemDetails body of the v4 Detail. The route carries its own
        block size cap (512 MiB) instead of Server.MaxBodyBytes, since the
        capture's block is 1.5 MB.
      operationId: checkAndPublishFile
      parameters:
        - name: comp
          in: query
          required: false
          schema:
            type: string
            enum: [block, blocklist]
            default: block
          description: An absent comp behaves like block
        - name: blockid
          in: query
          schema:
            type: string
            default: "00000000"
          description: Block id of a comp=block upload (Azure base64 form)
        - name: modId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw block bytes when comp is block; the XML or newline separated block list when comp is blocklist.
          application/xml:
            schema:
              type: string
              description: '<BlockList><Latest>00000000</Latest></BlockList>'
      responses:
        '200':
          description: The block or the commit was stored
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          description: Bad request, including a block list naming a block that was not uploaded
        '401':
          description: Unauthorized, or the caller is not the creator
        '404':
          description: Mod not found (ProblemDetails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error

