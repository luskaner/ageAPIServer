  # MatchContent
  /api/MatchContent/:
    post:
      tags:
        - MatchContent
      summary: Upload a multiplayer savegame or replay
      description: |
        Streams the multipart payload to disk and stores it under the match id.
        The parts are:

        * `fileContent` - the savegame or replay, with its original file name.
          Only known extensions are accepted (*.aoe2record, *.mgz, *.aoe3Yrec,
          ...). Its size is bounded by MatchContent.MaxFileSize.
        * `matchId` - the positive 32-bit id the file is stored under.

        The answer is JSON with `isError`, which the AOE2 DE client requires.
        Anonymous. Answers 404 when the match content store is disabled.
      operationId: uploadMatchContent
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - fileContent
                - matchId
              properties:
                fileContent:
                  type: string
                  format: binary
                matchId:
                  type: integer
      responses:
        '200':
          description: The file was stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  isError:
                    type: boolean
                    example: false
        '400':
          description: Invalid multipart body, missing matchId, invalid matchId, duplicate fileContent, empty file or unsupported extension
        '404':
          description: Match content store disabled
        '413':
          description: File too large
        '500':
          description: Cannot store the file

  /api/MatchContent/{matchId}:
    get:
      tags:
        - MatchContent
      summary: Get the metadata of a stored match file
      description: |
        Returns the JSON metadata the AOE2 DE client reads before it downloads
        the payload: fileName, fileSize, filePath (the absolute URL of the
        payload route) and fileCRC. Anonymous; answers 404 when the store is
        disabled or the id is unknown.
      operationId: getMatchContent
      security: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
          description: Match id the file was uploaded under
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  isError:
                    type: boolean
                    example: false
                  fileList:
                    type: array
                    items:
                      type: object
                      properties:
                        fileName:
                          type: string
                        fileSize:
                          type: integer
                        filePath:
                          type: string
                          format: uri
                        fileCRC:
                          type: string
        '404':
          description: Match content store disabled or file not found

  /api/MatchContent/{matchId}/file/{hash}:
    get:
      tags:
        - MatchContent
      summary: Download a stored match file
      description: |
        Streams the payload with its stored content type, length, MD5 ETag and
        Content-MD5 header. The `hash` must equal the stored MD5 digest, so
        stale metadata never downloads a replacement uploaded under the same
        id. Anonymous.
      operationId: downloadMatchContent
      security: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
          description: Match id the file was uploaded under
        - name: hash
          in: path
          required: true
          schema:
            type: string
          description: Stored MD5 digest of the file
      responses:
        '200':
          description: The raw file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Match content store disabled, file not found or hash mismatch

  # Ops
  /healthz:
    get:
      tags:
        - Ops
      summary: Health probe
      description: |
        Pings the database. Answers {"status":"ok"} on success and
        {"status":"unavailable"} with 503 when the database is unreachable.
        Anonymous.
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable

