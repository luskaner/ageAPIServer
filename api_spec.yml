openapi: "3.2.0"
info:
  title: Age of Empires Mods API
  version: "3.2.0"
  description: |
    OpenAPI specification for the Age of Empires Mods API (api.ageofempires.com).
    This API provides access to mod browsing, management, and download functionality
    for Age of Empires DE, Age of Empires II DE, Age of Empires III DE, Age of Empires IV,
    and Age of Mythology: Retold.

    Authentication: game clients send a Steam bearer token (`Authorization: Steam1.0 ...`).
    The website (www.ageofempires.com) calls the same API with its session cookie instead.
    Read-only endpoints (games, tags, featured, find, detail, related, reviews) were
    observed working anonymously.

    Path matching: the service resolves paths case-insensitively and treats trailing
    slashes as optional. Native clients call `/api/v4/Mods/...`; the website calls
    `/api/v4/mods/...` (including `/api/v4/mods/UnSubscribe/...`). Each operation is
    documented once, using the casing of the path key.

    Hosts: the Age of Empires IV client sends every mod request to
    `api-dr.ageofempires.com`, not only downloads; other clients use
    `api.ageofempires.com`. Both hosts serve the same API.

    Implementation endpoints: the Media (`/api/v4/mods/Image/...`), MatchContent
    (`/api/MatchContent/...`) and Ops (`/healthz`) operations are served by this
    implementation but were not part of the observed upstream surface. They are
    documented so the spec covers every route the server registers.
  contact:
    name: Age of Empires API
    url: https://www.ageofempires.com
  license:
    name: Proprietary
    url: https://www.ageofempires.com/terms-of-use
servers:
  - url: https://api.ageofempires.com
    description: Primary API server
  - url: https://api-dr.ageofempires.com
    description: Alternate host used by the Age of Empires IV client for all mod endpoints, and by all clients for downloads
security:
  - SteamAuth: []
  - XblAuth: []
  - WebSession: []
tags:
  - name: Games
    description: Game metadata endpoints
  - name: Tags
    description: Mod type/tag endpoints
  - name: Featured
    description: Featured mods endpoints
  - name: Mods
    description: Mod search, detail, and management endpoints
  - name: Polls
    description: Poll endpoints
  - name: Moderation
    description: Text moderation endpoint
  - name: Media
    description: Mod screenshots stored by Publish (implementation endpoint)
  - name: MatchContent
    description: Multiplayer savegame and replay exchange (implementation endpoint)
  - name: Ops
    description: Operational probes (implementation endpoint)
components:
  securitySchemes:
    SteamAuth:
      type: http
      scheme: bearer
      bearerFormat: "Steam1.0"
      description: Steam authentication token sent by the game clients
    XblAuth:
      type: http
      scheme: bearer
      bearerFormat: "XBL3.0"
      description: |
        Xbox token of the Microsoft Store clients, sent as
        `XBL3.0 x=<puid>;<XToken>`. The AOE3 capture carries Steam for the
        read endpoints and this for `My`, `Publish` and `Delete` in the same
        session.
    WebSession:
      type: apiKey
      in: cookie
      name: .AgeOfEmpiresServices
      description: Website session cookie used by www.ageofempires.com instead of a Steam token
  schemas:
    # Game schemas
    Game:
      type: object
      properties:
        gameTitleId:
          type: integer
          description: Unique game identifier
          enum: [1, 2, 3, 4, 1001]
        gameTitleName:
          type: string
          description: Display name of the game
        gameVersion:
          type: string
          nullable: true
          description: Current game version (if available)
      required:
        - gameTitleId
        - gameTitleName
      example:
        gameTitleId: 2
        gameTitleName: "Age of Empires II DE"
        gameVersion: null

    GameList:
      type: array
      items:
        $ref: '#/components/schemas/Game'

    # Tag schemas
    ModTag:
      type: object
      properties:
        modTypeId:
          type: integer
          description: Unique tag type identifier
        modTypeName:
          type: string
          description: Display name of the mod type
        gameTitleId:
          type: integer
          description: Game this tag belongs to
      required:
        - modTypeId
        - modTypeName
        - gameTitleId
      example:
        modTypeId: 15
        modTypeName: "Random Maps"
        gameTitleId: 2

    ModTagList:
      type: array
      items:
        $ref: '#/components/schemas/ModTag'

    # Mod schemas
    ModMetaData:
      type: object
      properties:
        modId:
          type: integer
        gameTitleId:
          type: integer
          nullable: true
        gameTitleName:
          type: string
          nullable: true
        modName:
          type: string
        description:
          type: string
          nullable: true
        modDescription:
          type: string
          nullable: true
        changeList:
          type: string
          nullable: true
        modVersion:
          type: number
        verifiedVersion:
          type: string
          nullable: true
        modTypeId:
          type: integer
          nullable: true
        clientId:
          type: string
          nullable: true
        modType:
          type: string
          nullable: true
        modTags:
          type: array
          items:
            type: string
          nullable: true
        modTagIds:
          type: array
          items:
            type: integer
          nullable: true
        modTagNames:
          type: array
          items:
            type: string
          nullable: true
        metaData:
          type: object
          nullable: true
        modStatusId:
          type: integer
          nullable: true
        modStatus:
          type: string
          enum: [Published, Featured, Unlisted, Draft]
          nullable: true
          description: |-
            The captures only carry 2/"Published" (every created mod) and
            5/"Featured" (the AOM Featured rows); any other stored id
            renders Published.
        modStatusMessage:
          type: string
          nullable: true
        modVisibility:
          type: string
          enum: [Public, Private, Unlisted]
          nullable: true
        creatorId:
          type: integer
          nullable: true
        creatorName:
          type: string
          nullable: true
        creatorAvatarUrl:
          type: string
          nullable: true
        isOwner:
          type: boolean
        isLoggedOn:
          type: boolean
        allowDiscussion:
          type: boolean
        discourseUrl:
          type: string
          nullable: true
        createDate:
          type: string
          format: date-time
        lastUpdate:
          type: string
          format: date-time
        updateAvailable:
          type: boolean
        modFileSize:
          type: number
        modDiskSize:
          type: number
          nullable: true
        popular:
          type: integer
          nullable: true
        downloads:
          type: integer
          nullable: true
        installs:
          type: integer
          nullable: true
        likes:
          type: integer
          nullable: true
        userLiked:
          type: boolean
          nullable: true
        ratings:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Ratings'
        currentRating:
          type: number
        userDownloaded:
          type: boolean
          nullable: true
        userInstalled:
          type: boolean
        userFlagged:
          type: boolean
          nullable: true
        userRating:
          type: number
          nullable: true
        userReview:
          type: string
          nullable: true
        positiveRatings:
          type: integer
        totalRatings:
          type: integer
        thumbnail:
          type: string
        fileUrl:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: object
            properties:
              imageId:
                type: string
              displayIndex:
                type: integer
              imageName:
                type: string
              imageThumbnail:
                type: string
              imageFileSize:
                type: number
                nullable: true
          nullable: true
        thirtyDayPopular:
          type: integer
          nullable: true
        sortName:
          type: string
          nullable: true
        sendNotifications:
          type: boolean

    Mod:
      description: A mod entry as returned in `modList` arrays.
      allOf:
        - $ref: '#/components/schemas/ModMetaData'

    ModList:
      type: object
      properties:
        searchParams:
          $ref: '#/components/schemas/SearchParams'
        modList:
          type: array
          items:
            $ref: '#/components/schemas/Mod'
        totalCount:
          type: integer
          nullable: true
        isLoggedOn:
          type: boolean
        errorCode:
          type: integer
          description: |
            -1 on success. Every capture of a list endpoint carries it, even
            when the response returns data.
        errorMessage:
          type: string
          description: Empty on success.

    SearchParams:
      type: object
      properties:
        q:
          type: string
          nullable: true
          description: Search query
        creator:
          type: string
          nullable: true
        filter:
          type: integer
          description: Mod type filter ID
        sort:
          type: string
          nullable: true
          enum: ["", popular, createDate, lastUpdate, downloads, rating, recentpopular, subscribers, creatorName, modName]
        order:
          type: string
          nullable: true
          enum: ["", ASC, DESC, asc, desc]
        start:
          type: integer
          description: Start offset or page as sent by the client (both 0-based and 1-based pagination are observed)
        count:
          type: integer
          description: Items per page
        game:
          type: integer
          description: Game ID
        modid:
          type: string
          nullable: true
          description: Mod ID filter. The echo always renders the number as a
            string, "0" when unset; the legacy v1 echoes keep null instead.

    # Request schemas
    FindModsRequest:
      type: object
      required:
        - game
      properties:
        game:
          type: integer
          description: Game ID (1, 2, 3, 4, 1001)
        start:
          type: integer
          default: 1
          minimum: 0
        count:
          type: integer
          default: 30
          minimum: 0
        order:
          type: string
          enum: ["", asc, desc, ASC, DESC]
          default: desc
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating, recentpopular, subscribers, modName]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        creator:
          type: string
          nullable: true
        modid:
          description: Mod ID filter; clients send either an integer (0 = none) or an empty string
          oneOf:
            - type: integer
            - type: string
        status:
          type: string
          nullable: true
        tags:
          description: Tag/type IDs; observed as integers, and as strings such as "-14"
          type: array
          items:
            oneOf:
              - type: integer
              - type: string
          nullable: true

    FindModsRequestV1:
      type: object
      required:
        - game
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 45
        order:
          type: string
          enum: ["", ASC, DESC]
          default: DESC
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        time:
          type: string
          description: Timestamp for pagination

    InstalledModsRequest:
      description: |
        Same filters as the Find request, except that the server default count
        is 1000 rather than 30. Native clients usually send only `game` (AOE3,
        AOM), while the AOE4 client and the website send the full filter body.
      type: object
      required:
        - game
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 1000
        order:
          type: string
          enum: ["", ASC, DESC, asc, desc]
          default: desc
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating, recentpopular, subscribers, modName]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        creator:
          type: string
          nullable: true
          description: The echo resolves it to "" when the body omits it.
        modid:
          description: Mod ID filter; clients send either an integer (0 = none) or an empty string
          oneOf:
            - type: integer
            - type: string
        status:
          type: string
          nullable: true
        tags:
          description: Tag/type IDs; observed as integers, and as strings such as "-14"
          type: array
          items:
            oneOf:
              - type: integer
              - type: string
          nullable: true

    MyModsRequest:
      type: object
      required:
        - game
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 45
        order:
          type: string
          enum: ["", ASC, DESC]
          default: DESC
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        time:
          type: string

    RateModRequest:
      type: object
      required:
        - modId
        - rating
      properties:
        modId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5

    FlagModRequest:
      type: object
      description: Report/flag a mod. `id` is the mod ID and `stringValue` is the reason label.
      required:
        - id
        - stringValue
      properties:
        id:
          type: integer
          description: Mod ID
        stringValue:
          type: string
          example: Poor Performance
        boolValue:
          type: boolean

    InstallModRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Mod ID

    UninstallModRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Mod ID

    CreateModRequestV1:
      type: object
      description: |
        Multipart body of the legacy Create. The live capture of the AOE2
        client carries these field names exactly (mixed casing included):
        `modFiles` is the zip archive, `modImages` the screenshots paired
        with `ImageMetaData` by file name, and the scalar fields spell
        `ModName`, `GameTitleId`, `ModType`, `modVisibility` and `ChangeList`.
        An `imageFileSize` of the metadata entry is a string. An update adds
        `ModId` and re-declares the existing image by its `imageId` with
        absolute URLs (and carries no file parts).
      properties:
        ModId:
          type: integer
          description: Present only when updating an existing owned mod (same id echoed).
        ModName:
          type: string
        GameTitleId:
          type: integer
        ModType:
          type: integer
        Description:
          type: string
        modVisibility:
          type: string
          enum: [Public, Private, Unlisted]
        ChangeList:
          type: string
        ImageMetaData:
          type: string
          description: JSON array of `{"displayIndex":0,"imageFileSize":"25261","imageName":"_preview-icon.jpg"}`.
        modImages:
          type: string
          format: binary
        modFiles:
          type: string
          format: binary

    DeletedModResponseV1:
      type: object
      description: The envelope the legacy Delete answers. resultValue is the string "true".
      properties:
        errorCode:
          type: integer
        errorMessage:
          type: string
        resultKey:
          type: string
          example: Deleted
        resultValue:
          type: string
          example: "true"
        resultJson:
          type: string
          nullable: true

    FeaturedModsRequest:
      type: object
      required:
        - game
      properties:
        q:
          type: string
          default: ""
        game:
          type: integer
          default: 1001
        modid:
          description: Mod ID filter; clients send either an integer (0 = none) or an empty string
          oneOf:
            - type: integer
            - type: string
        filter:
          type: integer
          default: 0
        status:
          type: string
          default: ""
        tags:
          type: array
          items:
            oneOf:
              - type: integer
              - type: string
          default: []
        sort:
          type: string
          enum: [recentpopular, popular, createDate, lastUpdate]
          default: popular
        order:
          type: string
          enum: [ASC, DESC]
          default: DESC
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 10

    # Response schemas
    SubscribeResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
        downloadCount:
          type: integer
        installCount:
          type: integer
          nullable: true
        gameTitleId:
          type: integer
        fileCRC:
          type: string

    UnsubscribeResponse:
      type: boolean

    RateModResponse:
      type: object
      properties:
        statusCode:
          type: integer
          nullable: true
        responseMessage:
          type: string
          nullable: true
        playFabResponse:
          $ref: '#/components/schemas/Ratings'

    Ratings:
      description: |
        Rating aggregate of a mod. The captures of November 2026 carry only
        average and totalCount: the per-star counters and the two
        favourable-review blocks of the August captures are gone. The block is
        always an object, even when the mod has no ratings.
      type: object
      properties:
        rating:
          type: object
          properties:
            average:
              type: number
            totalCount:
              type: integer
        reviewsCount:
          type: integer

    FlagResponse:
      type: object
      properties:
        errorCode:
          type: integer
        errorMessage:
          type: string
        resultKey:
          type: string
        resultValue:
          type: string
        resultJson:
          type: object
          nullable: true

    InstallModResponse:
      type: object
      properties:
        contentType:
          type: string
          nullable: true
        serializerSettings:
          type: object
          nullable: true
        statusCode:
          type: integer
          nullable: true
        value:
          $ref: '#/components/schemas/SubscribeResponse'

    UninstallModResponse:
      type: object
      properties:
        contentType:
          type: string
          nullable: true
        serializerSettings:
          type: object
          nullable: true
        statusCode:
          type: integer
          nullable: true
        value:
          type: boolean

    DownloadResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
        downloadCount:
          type: integer
        installCount:
          type: integer
          nullable: true
        gameTitleId:
          type: integer
        fileCRC:
          type: string

    DetailResponse:
      type: object
      properties:
        modId:
          type: integer
        gameTitleId:
          type: integer
        gameTitleName:
          type: string
        modName:
          type: string
        description:
          type: string
        modDescription:
          type: string
        changeList:
          type: string
        modVersion:
          type: number
        verifiedVersion:
          type: string
          nullable: true
        modTypeId:
          type: integer
          nullable: true
        clientId:
          type: string
          nullable: true
        modType:
          type: string
          nullable: true
        modTags:
          type: array
          items:
            type: string
          nullable: true
        modTagIds:
          type: array
          items:
            type: integer
          nullable: true
        modTagNames:
          type: array
          items:
            type: string
          nullable: true
        metaData:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModMetaData'
        modStatusId:
          type: integer
        modStatus:
          type: string
        modStatusMessage:
          type: string
          nullable: true
        modVisibility:
          type: string
          nullable: true
        creatorId:
          type: integer
          nullable: true
        creatorName:
          type: string
          nullable: true
        creatorAvatarUrl:
          type: string
          nullable: true
        isOwner:
          type: boolean
          nullable: true
        isLoggedOn:
          type: boolean
        allowDiscussion:
          type: boolean
        discourseUrl:
          type: string
          nullable: true
        createDate:
          type: string
          format: date-time
          nullable: true
        lastUpdate:
          type: string
          format: date-time
          nullable: true
        updateAvailable:
          type: boolean
          nullable: true
        modFileSize:
          type: number
          nullable: true
        modDiskSize:
          type: number
          nullable: true
        popular:
          type: integer
          nullable: true
        downloads:
          type: integer
          nullable: true
        installs:
          type: integer
          nullable: true
        likes:
          type: integer
          nullable: true
        userLiked:
          type: boolean
          nullable: true
        ratings:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Ratings'
        currentRating:
          type: number
        userDownloaded:
          type: boolean
          nullable: true
        userInstalled:
          type: boolean
          nullable: true
        userFlagged:
          type: boolean
          nullable: true
        userRating:
          type: number
          nullable: true
        userReview:
          type: string
          nullable: true
        positiveRatings:
          type: integer
        totalRatings:
          type: integer
        thumbnail:
          type: string
          nullable: true
        fileUrl:
          type: string
          nullable: true
        imageUrls:
          type: array
          items:
            type: object
            properties:
              imageId:
                type: string
              displayIndex:
                type: integer
              imageName:
                type: string
              imageThumbnail:
                type: string
              imageFileSize:
                type: number
                nullable: true
          nullable: true
        thirtyDayPopular:
          type: integer
          nullable: true
        sortName:
          type: string
          nullable: true
        sendNotifications:
          type: boolean

    # Moderation schemas
    TextModerationRequest:
      type: object
      required:
        - conversationId
        - textContent
        - language
        - textType
      properties:
        conversationId:
          type: string
        textContent:
          type: string
        language:
          type: string
        textType:
          type: string
          enum: [SanitisationUsername, SanitisationInput]
        includeResponse:
          type: boolean
          default: false

    TextModerationResponse:
      type: object
      properties:
        filterResult:
          type: string
          enum: [Allow, Block, Review]
        familyFriendlyResult:
          type: string
          enum: [Allow, Block, Review]
        mediumResult:
          type: string
          enum: [Allow, Block, Review]
        matureResult:
          type: string
          enum: [Allow, Block, Review]
        maturePlusResult:
          type: string
          enum: [Allow, Block, Review]
        translationAvailable:
          type: boolean
        moderatedText:
          type: string
        language:
          type: string

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: integer
          description: |
            Not an HTTP status: 400 for a bad request, 900 for an
            unauthenticated request, 404 for a missing resource and 500 for an
            internal error.
        errorMessage:
          type: string
        isLoggedOn:
          type: boolean
          description: Only the 401 carries it (false); the other errors omit it.

    ProblemDetails:
      type: object
      description: |
        RFC 9110 body the v4 API answers with when the resource does not exist
        (v4 Detail of a deleted mod, a CheckAndPublishFile commit of a missing
        mod). traceId is a W3C trace id: two 16-byte and 8-byte random groups
        between the version and flag bytes.
      properties:
        type:
          type: string
          format: uri
          description: Link to the RFC 9110 section of the status.
        title:
          type: string
        status:
          type: integer
        traceId:
          type: string

    # Legacy (v1) schemas. The v1 surface renders the same mods with a different
    # contract than v4: fewer fields, different nullability, ratings dropped and
    # tag ids rendered as strings.
    LegacyMod:
      description: One v1 modList row.
      type: object
      properties:
        modId:
          type: integer
        gameTitleId:
          type: integer
          nullable: true
          description: Always null in the v1 render.
        gameTitleName:
          type: string
          nullable: true
          description: Always null in the v1 render.
        modName:
          type: string
        description:
          type: string
          nullable: true
        modDescription:
          type: string
          nullable: true
        changeList:
          type: string
          nullable: true
          description: Always null in a v1 list.
        modVersion:
          type: number
          description: As stored; the v1 surface applies no 1.1 default.
        verifiedVersion:
          type: string
          nullable: true
        modTypeId:
          type: integer
          nullable: true
          description: Always null in the v1 render.
        clientId:
          type: string
          nullable: true
          description: Always null in the v1 render.
        modType:
          type: string
          nullable: true
        modTags:
          type: array
          items:
            type: string
          description: The tag ids rendered as strings.
        modTagIds:
          type: array
          items:
            type: integer
          nullable: true
          description: Always null; the ids live in modTags.
        modTagNames:
          type: array
          items:
            type: string
          nullable: true
        metaData:
          nullable: true
