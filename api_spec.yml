        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/Mods/Delete/:
    post:
      tags: [Legacy]
      summary: Delete a mod (v1)
      description: |
        Deletes a mod only when the caller is its creator. The body is
        `{"id":N}` and the answer is always the envelope with
        `resultKey: "Deleted"` and `resultValue: "true"`; the v4 Delete answers
        the bare `true` instead.
      operationId: deleteModV1
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallModRequest'
      responses:
