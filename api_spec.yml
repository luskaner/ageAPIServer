openapi: 3.2.1
info:
  title: Age of Empires Mods API
  version: "1.0.0"
  description: |
    OpenAPI description of ageAPIServer, the Go reimplementation of the
    Age of Empires Mods API: the v4 and legacy v1 mod catalogue, the polls,
    text moderation and the MatchContent savegame exchange used by Age of
    Empires DE, Age of Empires II DE, Age of Empires III DE, Age of Empires IV
    and Age of Mythology: Retold.

    ## Fidelity

    Every operation carries `x-fidelity`, with the meaning the project uses:

    * `Faithful` - the wire shape and the observable semantics of the official
      service are reproduced, quirks included: `errorCode` -1 in a successful
      list, `modid` echoed as a JSON string, `null` where the captures carry
      `null`. Identifiers, names, dates and counters are local, never
      byte-identical to the live service.
    * `Partial` - the official envelope, but reduced data (a seeded catalogue,
      a stub, a subset of the fields or of the flow).
    * `Different` - a deliberate, documented deviation from the official
      answer.
    * `Own` - no official counterpart; an endpoint this server adds.

    Every operation serves every supported title (`gameTitleId` 1, 2, 3, 4 and
    1001): this server has no per-title route registration.

    ## Authentication

    * Game clients send `Authorization: Steam1.0 <ticket>`.
    * Microsoft Store clients send `Authorization: XBL3.0 x=<puid>;<XToken>`.
    * The website (www.ageofempires.com) sends the `.AgeOfEmpiresServices`
      session cookie.

    The three schemes are alternatives: any one authenticates the request, and
    the resolved viewer drives `isLoggedOn`, the `user*` fields and ownership.
    A ticket is not verified cryptographically (the captures carry opaque
    tokens): any well-formed credential creates a local user keyed by its id.
    Do not expose a deployment to the internet without a real check.

    Operations that declare `security: []` are anonymous. Ownership is always
    checked against the resolved viewer, never against an id taken from the
    request body: only the creator may update or delete a mod.

    ## Path matching

    Paths are matched case-insensitively and the trailing slash is optional.
    Native clients call `/api/v4/Mods/...`, the website calls
    `/api/v4/mods/...` (including `/api/v4/mods/UnSubscribe/...`), and AOM
    mixes both casings in one session. Each operation is documented once, with
    the casing of its path key; the served routes are the lowercased,
    slash-free forms.

    ## Requests

    * GET binds fields from the query string.
    * POST and PUT accept a JSON body (`Content-Type: application/json`) or an
      `application/x-www-form-urlencoded` one; unknown fields are ignored, as
      the clients send more than the handlers read.
    * A missing field is not always its zero value: `count` 0 means "no
      limit", while an absent `count` takes the endpoint default. The schemas
      document both.
    * Bodies are capped by `Server.MaxBodySize` (1 MiB by default). Publish,
      the legacy Create and CheckAndPublishFile stream their archive and
      screenshots to disk under their own caps; `/api/MatchContent/` applies
      `MatchContent.MaxFileSize`.
    * Publish and the legacy Create take `multipart/form-data`; field names are
      read case-insensitively.

    ## Responses

    * JSON is `application/json; charset=utf-8` with no trailing newline: the
      game compares raw bytes.
    * Every list echoes the resolved filter in `searchParams`: `order` is
      upper-cased, `modid` is always a JSON string (`"0"` when unset), and
      `creator` is null, the empty string or the caller depending on the
      endpoint.
    * A successful list carries `errorCode: -1` and an empty `errorMessage`.
    * `totalCount` is null on an empty page (and always null on the legacy v1
      `My`).
    * Errors use the `ErrorResponse` envelope. Its `errorCode` is not an HTTP
      status: 400 bad request, 900 unauthenticated, 404 not found, 429 rate
      limited, 500 internal error. Only the 401 also carries `isLoggedOn`.
    * The v4 `Detail` of a deleted mod answers the RFC 9110 `ProblemDetails`
      body instead.

    ## Pagination

    `start` is a 1-based page number by default (`Pagination.Base = "page"`):
    `OFFSET = max(0, start-1) * count`, and both 0 and 1 mean the first page.
    `count` 0 means "no limit", bounded by `Pagination.MaxCount`. The echo
    reproduces `start` as sent (default 1).

    Sentinels: `q` `""` or `"*"`, `filter` 0 and `modid` 0/`""` mean "no
    filter"; a negative tag id excludes that tag.

    ## URLs

    `downloadUrl`, `fileUrl`, `imageName`, `imageThumbnail` and the
    MatchContent `filePath` are absolute. They use `Server.PublicBaseURL` when
    it is configured, otherwise the request host and scheme, honouring
    `X-Forwarded-Proto` and `X-Forwarded-Host`. `Server.PublicScheme` (default
    `http`) is the fallback for a deployment behind a TLS terminator that
    forwards only the host. A stored absolute URL (a CDN) is returned
    untouched.

    ## CORS

    The website preflights every POST. The middleware answers the preflight
    with 204 before the mux, allows only the configured origins
    (`Server.CORS.AllowedOrigins`, `https://www.ageofempires.com` by default),
    never uses a wildcard while credentials are allowed, and advertises the
    methods the inventory actually serves (GET, POST, PUT, OPTIONS).

    ## Hosts

    The clients are configured to reach `api.ageofempires.com`; every Age of
    Empires IV mod request and the downloads of all clients use
    `api-dr.ageofempires.com`. A deployment points both names at this server.

    ## Implementation endpoints

    The Media (`/api/v4/mods/Image/...`) and MatchContent
    (`/api/MatchContent/...`) operations are this server's own surface, not a
    reimplementation of an observed upstream route, and the Ops routes
    (`/test`, `/cacert.pem` and `/openapi.yml`) are entirely local as well.
    They carry `x-fidelity: Own` and are documented so the spec covers every
    route the server registers.

    ## Configuration that changes the wire

    * `Server.UploadDir` is where Publish stores archives and screenshots. When
      it is empty, a publish that carries a file is rejected and
      `/api/v4/mods/Download/{modId}/file` answers 500.
    * `MatchContent.Enabled=false` leaves the three MatchContent routes
      answering 404.
    * `MatchContent.RateLimitPerMinute` adds the 429 (and `Retry-After`) to the
      MatchContent routes; zero disables the limit, which is the captured
      behaviour.
    * `Server.TLS.Mode` decides whether `/cacert.pem` has a certificate of its
      own: `on` serves it, `off` and `proxy` answer 404.
