paths:
  # ---------------------------------------------------------------------------
  # v4 catalogue
  # ---------------------------------------------------------------------------

  /api/v4/mods/Games:
    get:
      tags: [Games]
      summary: List the supported games
      description: |
        Returns the five titles the mods API serves, with the game version when
        the catalogue carries one (`gameVersion` is otherwise null).
      operationId: getGames
      x-fidelity: Faithful
      responses:
        '200':
          description: The game catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
              examples:
                catalog:
                  $ref: '#/components/examples/GameList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/Tags:
    get:
      tags: [Tags]
      summary: List the mod types/tags
      description: |
        Returns the mod types of every game, or only those of `game` when the
        query parameter is present. This catalogue is the one Publish validates
        `modTags` against, and the answer without `game` is the golden
        `testdata/tags.json` of the test suite.
      operationId: getTags
      x-fidelity: Faithful
      parameters:
        - $ref: '#/components/parameters/GameQuery'
      responses:
        '200':
          description: The mod type catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModTagList'
              examples:
                catalog:
                  $ref: '#/components/examples/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/Featured:
    post:
      tags: [Featured]
      summary: List the featured mods of a game
      description: |
        Returns the mods whose stored status is 5 ("Featured") for the game.

        The echo resolves the defaults of a body that only carries `game`: the
        AOM client sends `{"game":1001}` and receives sort `popular`, order
        `DESC`, count 10 and creator null. The website sends its sort
        (`recentpopular`), count (3) and filters explicitly, and those are
        echoed as sent.
      operationId: getFeaturedMods
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturedModsRequest'
      responses:
        '200':
          description: The featured page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
              examples:
                page:
                  $ref: '#/components/examples/ModListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/Find/:
    post:
      tags: [Mods]
      summary: Search the mod catalogue
      description: |
        Searches the catalogue of one game with the filters and sorting of the
        body.

        `searchParams` echoes the request as resolved: `order` is upper-cased
        (`desc` answers `DESC`), `modid` is always a JSON string (`"0"` when the
        body omits it, even when the client sent the number 0), `status` and
        `tags` are not echoed, and `start` defaults to 1. `totalCount` is null
        on an empty page.
      operationId: findModsV4
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindModsRequest'
      responses:
        '200':
          description: The matching page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
              examples:
                page:
                  $ref: '#/components/examples/ModListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/Detail/{modId}:
    get:
      tags: [Mods]
      summary: Get one mod (v4)
      description: |
        Returns one mod as the v4 detail. Unset values render the defaults of
        the captures: `modVersion` 1.1, `verifiedVersion` and
        `modStatusMessage` empty strings, `modTags` null (the ids live in
        `modTagIds`), and the media fields as absolute URLs.

        A deleted or unknown mod answers the RFC 9110 `ProblemDetails` body,
        not the mod `ErrorResponse` envelope.
      operationId: getModDetailV4
      x-fidelity: Faithful
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Mod identifier.
      responses:
        '200':
          description: The mod detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/Installed/:
    post:
      tags: [Mods]
      summary: List the mods the caller installed
      description: |
        AOE3 and AOM send only `{"game":N}`; the echo then resolves sort
        `popular`, order `DESC` and count 1000, and creator as the empty string
        (not the caller). The AOE4 client and the website send the full filter
        body and get it echoed as sent.
      operationId: getInstalledModsV4
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstalledModsRequest'
      responses:
        '200':
          description: The installed page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
              examples:
                page:
                  $ref: '#/components/examples/ModListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/My/:
    post:
      tags: [Mods]
      summary: List the mods the caller created
      description: |
        A body without `count` uses 10; every explicit count is capped at 500
        in the page and echoed as 500 (the captures send 12, 1000 and 20000).
        The echo resolves creator to the caller's platform id.
      operationId: getMyModsV4
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyModsRequestV4'
      responses:
        '200':
          description: The caller's page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
              examples:
                page:
                  $ref: '#/components/examples/ModListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # v4 user state
  # ---------------------------------------------------------------------------

  /api/v4/Mods/Subscribe/{modId}:
    get:
      tags: [Mods]
      summary: Subscribe to a mod
      description: |
        Records the subscription of the caller and returns the download target.
        It does not touch the download counter: the AOE4 client calls Subscribe
        and Download for the same mod, and only the latter counts.
      operationId: subscribeModV4
      x-fidelity: Faithful
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Mod identifier.
      responses:
        '200':
          description: The download target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeResponse'
              examples:
                target:
                  $ref: '#/components/examples/DownloadInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/Unsubscribe/{modId}:
    get:
      tags: [Mods]
      summary: Unsubscribe from a mod
      description: |
        Removes the subscription of the caller. The answer is the bare JSON
        literal `true`, not an object.
      operationId: unsubscribeModV4
      x-fidelity: Faithful
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Mod identifier.
      responses:
        '200':
          description: The subscription was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResponse'
              examples:
                ok:
                  $ref: '#/components/examples/TrueLiteral'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/Rate/:
    post:
      tags: [Mods]
      summary: Rate a mod
      description: |
        Stores the caller's rating (1-5) and answers the refreshed aggregate of
        the mod. The aggregates are recomputed in the same transaction, so a
        later sort by rating never reads a stale value.
      operationId: rateModV4
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateModRequest'
      responses:
        '200':
          description: The refreshed aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateModResponse'
              examples:
                rated:
                  $ref: '#/components/examples/RateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/Mods/Download/{modId}/:
    get:
      tags: [Mods]
      summary: Get the download target of a mod
      description: |
        Returns the download target and counts the download once per user, so a
        retry does not inflate the counter. `downloadUrl` is absolute and points
        at `/api/v4/mods/Download/{modId}/file`, or at the stored absolute URL
        when it is a CDN.
      operationId: downloadModV4
      x-fidelity: Faithful
      servers:
        - url: https://api-dr.ageofempires.com
          description: Download redirect host.
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Mod identifier.
      responses:
        '200':
          description: The download target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
              examples:
                target:
                  $ref: '#/components/examples/DownloadInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/Download/{modId}/file:
    get:
      tags: [Mods]
      summary: Download the stored mod archive
      description: |
        Streams the stored archive as an attachment. It is the target of the
        `downloadUrl` that Subscribe and Download return, requires
        authentication and does not count a download (the JSON endpoint owns
        the counter). A mod without a file answers 404; a deployment without
        `Server.UploadDir` answers 500.
      operationId: downloadModFileV4
      x-fidelity: Faithful
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Mod identifier.
      responses:
        '200':
          description: The raw archive.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # Media (implementation endpoint)
  # ---------------------------------------------------------------------------

  /api/v4/mods/Image/{name}:
    get:
      tags: [Media]
      summary: Get a stored mod screenshot
      description: |
        Serves a screenshot stored by Publish from `Server.UploadDir`.
        Anonymous: a thumbnail carries no user data and the game may fetch it
        before it authenticates. The path parameter is reduced to its base
        name, so a traversal cannot escape the upload directory.
      operationId: getModImage
      x-fidelity: Own
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Stored image file name (the path is reduced to its base name).
      responses:
        '200':
          description: The image bytes, served with the type of the stored file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # v4 reviews and relations
  # ---------------------------------------------------------------------------

  /api/v4/mods/Reviews:
    post:
      tags: [Mods]
      summary: List the reviews of a mod
      description: |
        Returns one page of reviews of a mod. `modId` is a string. `page` and
        `count` are read as sent (defaults 1 and 5) and are not validated
        against a maximum; `ratingNum` is passed through without a 1..5 check
        (a capture sends 7), and `ratingLabel` is accepted but unused.
        `totalCount` is null when the mod has no reviews and
        `continuationToken` is always null.
      operationId: getModReviews
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewsRequest'
      responses:
        '200':
          description: One page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsResponse'
              examples:
                one:
                  $ref: '#/components/examples/Reviews'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/Related/{modId}:
    get:
      tags: [Mods]
      summary: List the mods related to one mod
      description: |
        Returns up to six mods of the same game that share at least one tag
        with the given mod (excluding itself), falling back to the same game
        when no mod shares a tag. Rows are ordered by popularity and mod id,
        both descending. The echo is fixed rather than resolved: start 0, count
        6, sort/order null, creator null and `modid` as the requested id string.
        `totalCount` is the size of the page, and the rows carry `modTags` null,
        unlike Find.

        No related mods, or an unknown mod id, answers 204 with an empty body
        instead of a 404.
      operationId: getRelatedMods
      x-fidelity: Faithful
      parameters:
        - name: modId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Mod identifier.
      responses:
        '200':
          description: The related page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModList'
        '204':
          description: No related mods, or the requested mod does not exist.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # v4 management
  # ---------------------------------------------------------------------------

  /api/v4/mods/Publish:
    post:
      tags: [Mods]
      summary: Publish or update a mod
      description: |
        Creates a mod when `modId` is absent and updates it when present.
        Multipart fields are read case-insensitively; `modName` and
        `description` accept the AOE4 JSON localization map and store its plain
        string (`en` wins, otherwise the first entry); `modVisibility` is read
        case-insensitively. `modStatusId` is always 2 (Published), whatever the
        visibility.

        A create without tags also gets the auto tag 26 ("Other"). A publish
        with a file stores it content-addressed under `Server.UploadDir` and
        sets `modDiskSize` to the uncompressed size of the archive. An update
        without `changeList` bumps `modVersion` by 0.1 and flips
        `updateAvailable` for subscribers of the previous version.

        The website (cookie-authenticated) adds form rules the game clients do
        not see: description required, 1-5 images from the picker's formats, at
        most 7 tags and a .zip archive.
      operationId: publishMod
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: The mod was stored; resultValue is its id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModIdResult'
              examples:
                stored:
                  $ref: '#/components/examples/ModIdResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/CheckAndPublishFile:
    put:
      tags: [Mods]
      summary: Upload the mod archive (Azure Block Blob style)
      description: |
        The upload the AOE4 client performs right after Publish: one request per
        block and a final commit, both answering the bare JSON literal `true`.

        * `?comp=block&blockid=00000000&modId=N` - the body is the raw archive
          bytes; the block is staged under `UploadDir/blocks/<modId>/` and
          nothing visible changes yet.
        * `?comp=blocklist&modId=N` - the body is
          `<?xml version="1.0" encoding="utf-8"?><BlockList><Latest>00000000</Latest></BlockList>`
          (newline-separated block ids are also accepted). The commit
          concatenates the listed blocks in order, stores them as the mod file
          with a `.sga` extension, fills `fileUrl`, `fileCRC`, `modFileSize`
          and `modDiskSize` (all equal: the capture commits 1509669) and stamps
          `lastUpdate`.

        `modId` is required on both calls; a missing `comp` behaves like
        `block`. The commit requires the caller to own the mod (401 otherwise)
        and a missing mod answers the mod `ErrorResponse` 404. The route is
        exempt from `Server.MaxBodySize`: a block is capped at 512 MiB and the
        commit body at 1 MiB.
      operationId: checkAndPublishFile
      x-fidelity: Faithful
      parameters:
        - $ref: '#/components/parameters/Comp'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/ModIdQuery'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw block bytes when comp is block.
          application/xml:
            schema:
              type: string
              description: '<BlockList><Latest>00000000</Latest></BlockList>'
      responses:
        '200':
          description: The block or the commit was stored.
          content:
            application/json:
              schema:
                type: boolean
                examples: [true]
              examples:
                ok:
                  $ref: '#/components/examples/TrueLiteral'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/Delete:
    post:
      tags: [Mods]
      summary: Delete a mod
      description: |
        Deletes a mod and everything that hangs off it (tags, images, reviews,
        ratings, installs, reports). Only its creator may delete it; a foreign
        mod answers 401. The body carries the id as a number and the answer is
        the bare `true`.
      operationId: deleteMod
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteModRequest'
      responses:
        '200':
          description: The mod was deleted.
          content:
            application/json:
              schema:
                type: boolean
                examples: [true]
              examples:
                deleted:
                  $ref: '#/components/examples/TrueLiteral'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v4/mods/Report:
    post:
      tags: [Mods]
      summary: Report a mod
      description: |
        Records a concern about a mod. Every field of the body is a string,
        including `modId` (unlike Delete). The answer is the bare `true`.
      operationId: reportMod
      x-fidelity: Faithful
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportModRequest'
      responses:
        '200':
          description: The report was recorded.
          content:
            application/json:
              schema:
                type: boolean
                examples: [true]
              examples:
                recorded:
                  $ref: '#/components/examples/TrueLiteral'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

