  schemas:
    # Game schemas
    Game:
      type: object
      properties:
        gameTitleId:
          type: integer
          description: Unique game identifier
          enum: [1, 2, 3, 4, 1001]
        gameTitleName:
          type: string
          description: Display name of the game
        gameVersion:
          type: [string, 'null']
          description: Current game version (if available)
      required:
        - gameTitleId
        - gameTitleName
        - gameVersion
      examples:
        - gameTitleId: 2
          gameTitleName: "Age of Empires II DE"
          gameVersion: null

    GameList:
      type: array
      items:
        $ref: '#/components/schemas/Game'

    # Tag schemas
    ModTag:
      type: object
      properties:
        modTypeId:
          type: integer
          description: Unique tag type identifier
        modTypeName:
          type: string
          description: Display name of the mod type
        gameTitleId:
          type: integer
          description: Game this tag belongs to
      required:
        - modTypeId
        - modTypeName
        - gameTitleId
      examples:
        - modTypeId: 15
          modTypeName: "Random Maps"
          gameTitleId: 2

    ModTagList:
      type: array
      items:
        $ref: '#/components/schemas/ModTag'

    ModImage:
      type: object
      description: One entry of `imageUrls`.
      properties:
        imageId:
          type: string
        displayIndex:
          type: integer
        imageName:
          type: string
        imageThumbnail:
          type: string
        imageFileSize:
          type: [number, 'null']
      required: [imageId, displayIndex, imageName, imageThumbnail]

    # Mod schemas
    ModMetaData:
      type: object
      properties:
        modId:
          type: integer
        gameTitleId:
          type: [integer, 'null']
        gameTitleName:
          type: [string, 'null']
        modName:
          type: string
        description:
          type: [string, 'null']
        modDescription:
          type: [string, 'null']
        changeList:
          type: [string, 'null']
        modVersion:
          type: number
        verifiedVersion:
          type: [string, 'null']
        modTypeId:
          type: [integer, 'null']
        clientId:
          type: [string, 'null']
        modType:
          type: [string, 'null']
        modTags:
          type: [array, 'null']
          items:
            type: string
        modTagIds:
          type: [array, 'null']
          items:
            type: integer
        modTagNames:
          type: [array, 'null']
          items:
            type: string
        metaData:
          type: [object, 'null']
        modStatusId:
          type: [integer, 'null']
        modStatus:
          type: [string, 'null']
          enum: [Published, Featured, Unlisted, Draft]
          description: |-
            The captures only carry 2/"Published" (every created mod) and
            5/"Featured" (the AOM Featured rows); any other stored id
            renders Published.
        modStatusMessage:
          type: [string, 'null']
        modVisibility:
          type: [string, 'null']
          enum: [Public, Private, Unlisted]
        creatorId:
          type: [integer, 'null']
        creatorName:
          type: [string, 'null']
        creatorAvatarUrl:
          type: [string, 'null']
        isOwner:
          type: boolean
        isLoggedOn:
          type: boolean
        allowDiscussion:
          type: boolean
        discourseUrl:
          type: [string, 'null']
        createDate:
          type: string
          format: date-time
        lastUpdate:
          type: string
          format: date-time
        updateAvailable:
          type: boolean
        modFileSize:
          type: number
        modDiskSize:
          type: [number, 'null']
        popular:
          type: [integer, 'null']
        downloads:
          type: [integer, 'null']
        installs:
          type: [integer, 'null']
        likes:
          type: [integer, 'null']
        userLiked:
          type: [boolean, 'null']
        ratings:
          $ref: '#/components/schemas/Ratings'
        currentRating:
          type: number
        userDownloaded:
          type: [boolean, 'null']
        userInstalled:
          type: boolean
        userFlagged:
          type: [boolean, 'null']
        userRating:
          type: [number, 'null']
        userReview:
          type: [string, 'null']
        positiveRatings:
          type: integer
        totalRatings:
          type: integer
        thumbnail:
          type: string
        fileUrl:
          type: [string, 'null']
        imageUrls:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ModImage'
        thirtyDayPopular:
          type: [integer, 'null']
        sortName:
          type: [string, 'null']
        sendNotifications:
          type: boolean

    Mod:
      description: A mod entry as returned in `modList` arrays.
      allOf:
        - $ref: '#/components/schemas/ModMetaData'

    ModList:
      type: object
      properties:
        searchParams:
          $ref: '#/components/schemas/SearchParams'
        modList:
          type: array
          items:
            $ref: '#/components/schemas/Mod'
        totalCount:
          type: [integer, 'null']
        isLoggedOn:
          type: boolean
        errorCode:
          type: integer
          description: |
            -1 on success. Every capture of a list endpoint carries it, even
            when the response returns data.
        errorMessage:
          type: string
          description: Empty on success.
      required: [searchParams, modList, totalCount, isLoggedOn, errorCode, errorMessage]

    SearchParams:
      type: object
      description: |
        Echo of the request as the endpoint resolved it. Every field is always
        present; the v1 echo keeps the raw request instead of resolving the
        sort/order defaults.
      properties:
        q:
          type: string
          description: Search query; always a string ("" when unset).
        creator:
          type: [string, 'null']
          description: Creator filter; null when the request omitted it.
        filter:
          type: integer
          description: Mod type filter id (0 means no filter).
        sort:
          type: [string, 'null']
          enum: ["", popular, createDate, lastUpdate, downloads, rating, recentpopular, subscribers, creatorName, modName, null]
        order:
          type: [string, 'null']
          enum: ["", ASC, DESC, asc, desc, null]
          description: The v4 echo upper-cases the value the client sent.
        start:
          type: integer
          description: Echo of start (default 1); the page number, unless Pagination.Base is offset.
        count:
          type: integer
          description: Resolved page size (0 means no limit in the request).
        game:
          type: integer
        modid:
          type: [string, 'null']
          description: |
            Mod id filter. The v4 echo always renders it as a JSON string, "0"
            when unset, even when the client sent the number 0. The legacy v1
            echo keeps null when the request omitted it.
      required: [q, creator, filter, sort, order, start, count, game, modid]

    # Request schemas
    FindModsRequest:
      type: object
      required:
        - game
      properties:
        game:
          type: integer
          description: Game ID (1, 2, 3, 4, 1001)
        start:
          type: integer
          default: 1
          minimum: 0
        count:
          type: integer
          default: 30
          minimum: 0
        order:
          type: string
          enum: ["", asc, desc, ASC, DESC]
          default: desc
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating, recentpopular, subscribers, modName]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        creator:
          type: [string, 'null']
        modid:
          description: Mod ID filter; clients send either an integer (0 = none) or an empty string
          oneOf:
            - type: integer
            - type: string
        status:
          type: [string, 'null']
        tags:
          description: Tag/type IDs; observed as integers, and as strings such as "-14"
          type: [array, 'null']
          items:
            oneOf:
              - type: integer
              - type: string

    FindModsRequestV1:
      type: object
      required:
        - game
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 45
        order:
          type: string
          enum: ["", ASC, DESC]
          default: DESC
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        time:
          type: string
          description: Timestamp for pagination

    InstalledModsRequest:
      description: |
        Same filters as the Find request, except that the server default count
        is 1000 rather than 30. Native clients usually send only `game` (AOE3,
        AOM), while the AOE4 client and the website send the full filter body.
      type: object
      required:
        - game
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 1000
        order:
          type: string
          enum: ["", ASC, DESC, asc, desc]
          default: desc
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating, recentpopular, subscribers, modName]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        creator:
          type: [string, 'null']
          description: The echo resolves it to "" when the body omits it.
        modid:
          description: Mod ID filter; clients send either an integer (0 = none) or an empty string
          oneOf:
            - type: integer
            - type: string
        status:
          type: [string, 'null']
        tags:
          description: Tag/type IDs; observed as integers, and as strings such as "-14"
          type: [array, 'null']
          items:
            oneOf:
              - type: integer
              - type: string

    MyModsRequest:
      type: object
      required:
        - game
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 45
        order:
          type: string
          enum: ["", ASC, DESC]
          default: DESC
        sort:
          type: string
          enum: ["", popular, createDate, lastUpdate, downloads, rating]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        time:
          type: string

    RateModRequest:
      type: object
      required:
        - modId
        - rating
      properties:
        modId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5

    FlagModRequest:
      type: object
      description: Report/flag a mod. `id` is the mod ID and `stringValue` is the reason label.
      required:
        - id
        - stringValue
      properties:
        id:
          type: integer
          description: Mod ID
        stringValue:
          type: string
          examples: [Poor Performance]
        boolValue:
          type: boolean

    InstallModRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Mod ID

    UninstallModRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Mod ID

    CreateModRequestV1:
      type: object
      description: |
        Multipart body of the legacy Create. The live capture of the AOE2
        client carries these field names exactly (mixed casing included):
        `modFiles` is the zip archive, `modImages` the screenshots paired
        with `ImageMetaData` by file name, and the scalar fields spell
        `ModName`, `GameTitleId`, `ModType`, `modVisibility` and `ChangeList`.
        An `imageFileSize` of the metadata entry is a string. An update adds
        `ModId` and re-declares the existing image by its `imageId` with
        absolute URLs (and carries no file parts).
      properties:
        ModId:
          type: integer
          description: Present only when updating an existing owned mod (same id echoed).
        ModName:
          type: string
        GameTitleId:
          type: integer
        ModType:
          type: integer
        Description:
          type: string
        modVisibility:
          type: string
          enum: [Public, Private, Unlisted]
        ChangeList:
          type: string
        ImageMetaData:
          type: string
          description: JSON array of `{"displayIndex":0,"imageFileSize":"25261","imageName":"_preview-icon.jpg"}`.
        modImages:
          type: string
          format: binary
        modFiles:
          type: string
          format: binary

    DeletedModResponseV1:
      type: object
      description: The envelope the legacy Delete answers. resultValue is the string "true".
      properties:
        errorCode:
          type: integer
        errorMessage:
          type: string
        resultKey:
          type: string
          examples: [Deleted]
        resultValue:
          type: string
          examples: ["true"]
        resultJson:
          type: [string, 'null']

    FeaturedModsRequest:
      type: object
      required:
        - game
      properties:
        q:
          type: string
          default: ""
        game:
          type: integer
          default: 1001
        modid:
          description: Mod ID filter; clients send either an integer (0 = none) or an empty string
          oneOf:
            - type: integer
            - type: string
        filter:
          type: integer
          default: 0
        status:
          type: string
          default: ""
        tags:
          type: array
          items:
            oneOf:
              - type: integer
              - type: string
          default: []
        sort:
          type: string
          enum: [recentpopular, popular, createDate, lastUpdate]
          default: popular
        order:
          type: string
          enum: [ASC, DESC]
          default: DESC
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 10

    MyModsRequestV4:
      type: object
      required: [game]
      properties:
        game:
          type: integer
        start:
          type: integer
          default: 1
        count:
          type: integer
          default: 10
          maximum: 500
          description: |
            A body without count uses 10. Every explicit value is capped at
            500 in the page and echoed as 500: the captures send 12, 1000 and
            20000 and all answer 500.
        order:
          type: string
          enum: [ASC, DESC]
          default: DESC
        sort:
          type: string
          enum: [popular, createDate, lastUpdate, downloads, rating]
          default: popular
        q:
          type: string
          default: ""
        filter:
          type: integer
          default: 0
        modid:
          type: string
          default: ""
          description: Mod id filter as a string; "" means no filter.

    PublishRequest:
      type: object
      required: [gameTitleId, modName]
      properties:
        modId:
          type: integer
          description: Present only when updating an existing owned mod.
        gameTitleId:
          type: integer
        modType:
          type: integer
          description: |
            Mod type id, stored as sent: the Tags catalogue of the game is not
            consulted, so an id it does not list still attaches (the AOE4
            client uploads type 6 "Extension" for game 4, whose catalogue stops
            at 5). A create without tags also gets the auto tag 26 ("Other").
        modName:
          type: string
          description: |
            The AOE4 client sends a JSON localization map such as
            {"es":"moddisplayname"}; the plain string is stored (the "en" entry
            wins, otherwise the first entry in the request order).
        description:
          type: string
          description: Same JSON localization map handling as modName.
        changeList:
          type: string
          description: |
            Stored prefixed with the mod-update-date header of the day when it
            is not empty. An update without one bumps modVersion by 0.1 and
            flips updateAvailable for subscribers of the previous version.
        modVisibility:
          type: string
          enum: [Public, Private, Unlisted]
          default: Public
          description: Read case-insensitively; the AOE4 client sends lowercase.
        modDiscussion:
          type: boolean
          default: false
        modTags:
          type: array
          description: Repeated field or one comma-separated value.
          items:
            type: integer
        ImageMetaData:
          type: string
          description: |
            JSON array of {imageId, displayIndex, imageName, imageThumbnail}.
            An entry is paired with the modImages part of the same file name;
            an entry without an upload keeps the thumbnail the client sent.
            The website adds its own rules to this form: description required,
            1-5 images from the picker's formats, at most 7 tags and a .zip
            archive.
        modImages:
          type: array
          items:
            type: string
            format: binary
        modFiles:
          type: string
          format: binary

    ReviewsRequest:
      type: object
      required: [modId]
      properties:
        modId:
          type: string
          description: Mod id as a string.
        page:
          type: integer
          default: 1
          description: Read as sent; not validated against a minimum.
        count:
          type: integer
          default: 5
          description: Read as sent; not validated against a maximum.
        ratingNum:
          type: integer
          description: Star filter, passed through without a 1..5 check (a capture sends 7).
        ratingLabel:
          type: string
          description: Accepted for compatibility; unused by the query.

    DeleteModRequest:
      type: object
      required: [modId]
      properties:
        modId:
          type: integer
          description: Mod id as a number (Report carries it as a string).

    ReportModRequest:
      type: object
      required: [modId, concernCategoryId, concernCategoryName]
      properties:
        modId:
          type: string
          description: Mod id as a string, unlike Delete.
        concernCategoryId:
          type: string
        concernCategoryName:
          type: string
        concernContent:
          type: string

    DetailRequestV1:
      type: object
      required: [modid]
      properties:
        modid:
          description: Mod id; clients send either an integer or its string form.
          oneOf:
            - type: integer
            - type: string
        game:
          type: integer
          description: Optional; the capture sends only modid and the value is unused.

    # Response schemas
    SubscribeResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
        downloadCount:
          type: integer
        installCount:
          type: integer
        gameTitleId:
          type: integer
        fileCRC:
          type: string

    UnsubscribeResponse:
      type: boolean

    RateModResponse:
      type: object
      description: |
        The envelope the captures answer: statusCode and responseMessage are
        always null and playFabResponse carries the refreshed aggregate.
      properties:
        statusCode:
          type: 'null'
          description: Always null.
        responseMessage:
          type: 'null'
          description: Always null.
        playFabResponse:
          $ref: '#/components/schemas/Ratings'
      required: [statusCode, responseMessage, playFabResponse]

    Ratings:
      description: |
        Rating aggregate of a mod. The captures of November 2026 carry only
        average and totalCount: the per-star counters and the two
        favourable-review blocks of the August captures are gone. The block is
        always an object, even when the mod has no ratings.
      type: object
      properties:
        rating:
          type: object
          properties:
            average:
              type: number
            totalCount:
              type: integer
        reviewsCount:
          type: integer

    FlagResponse:
      type: object
      properties:
        errorCode:
          type: integer
        errorMessage:
          type: string
        resultKey:
          type: string
        resultValue:
          type: string
        resultJson:
          type: [object, 'null']

    InstallModResponse:
      type: object
      properties:
        contentType:
          type: [string, 'null']
        serializerSettings:
          type: [object, 'null']
        statusCode:
          type: [integer, 'null']
        value:
          $ref: '#/components/schemas/SubscribeResponse'

    UninstallModResponse:
      type: object
      properties:
        contentType:
          type: [string, 'null']
        serializerSettings:
          type: [object, 'null']
        statusCode:
          type: [integer, 'null']
        value:
          type: boolean

    DownloadResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
        downloadCount:
          type: integer
        installCount:
          type: integer
        gameTitleId:
          type: integer
        fileCRC:
          type: string

    DetailResponse:
      type: object
      description: |
        The v4 detail. Unlike a list row, the handler fills the capture
        defaults: modVersion 1.1, verifiedVersion and modStatusMessage empty
        strings, and modTags null (the ids live in modTagIds).
      properties:
        modId:
          type: integer
        gameTitleId:
          type: integer
        gameTitleName:
          type: string
        modName:
          type: string
        description:
          type: string
        modDescription:
          type: string
        changeList:
          type: string
        modVersion:
          type: number
        verifiedVersion:
          type: string
        modTypeId:
          type: [integer, 'null']
        clientId:
          type: [string, 'null']
        modType:
          type: [string, 'null']
        modTags:
          type: [array, 'null']
          items:
            type: string
        modTagIds:
          type: [array, 'null']
          items:
            type: integer
        modTagNames:
          type: [array, 'null']
          items:
            type: string
        metaData:
          anyOf:
            - $ref: '#/components/schemas/ModMetaData'
            - type: 'null'
        modStatusId:
          type: integer
        modStatus:
          type: string
        modStatusMessage:
          type: string
        modVisibility:
          type: [string, 'null']
        creatorId:
          type: [integer, 'null']
        creatorName:
          type: [string, 'null']
        creatorAvatarUrl:
          type: [string, 'null']
        isOwner:
          type: [boolean, 'null']
        isLoggedOn:
          type: boolean
        allowDiscussion:
          type: boolean
        discourseUrl:
          type: [string, 'null']
        createDate:
          type: [string, 'null']
          format: date-time
        lastUpdate:
          type: [string, 'null']
          format: date-time
        updateAvailable:
          type: [boolean, 'null']
        modFileSize:
          type: [number, 'null']
        modDiskSize:
          type: [number, 'null']
        popular:
          type: [integer, 'null']
        downloads:
          type: [integer, 'null']
        installs:
          type: [integer, 'null']
        likes:
          type: [integer, 'null']
        userLiked:
          type: [boolean, 'null']
        ratings:
          $ref: '#/components/schemas/Ratings'
        currentRating:
          type: number
        userDownloaded:
          type: [boolean, 'null']
        userInstalled:
          type: [boolean, 'null']
        userFlagged:
          type: [boolean, 'null']
        userRating:
          type: [number, 'null']
        userReview:
          type: [string, 'null']
        positiveRatings:
          type: integer
        totalRatings:
          type: integer
        thumbnail:
          type: [string, 'null']
        fileUrl:
          type: [string, 'null']
        imageUrls:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ModImage'
        thirtyDayPopular:
          type: [integer, 'null']
        sortName:
          type: [string, 'null']
        sendNotifications:
          type: boolean

    ModIdResult:
      type: object
      description: |
        Envelope of Publish and the legacy Create. The new or updated id travels
        in resultValue as a string and resultJson is always null.
      properties:
        errorCode:
          type: integer
          examples: [0]
        errorMessage:
          type: string
          examples: ["0"]
        resultKey:
          type: string
          examples: [ModId]
        resultValue:
          type: string
          examples: ["593779"]
        resultJson:
          type: 'null'
      required: [errorCode, errorMessage, resultKey, resultValue]

    Review:
      type: object
      properties:
        helpfulNegative:
          type: integer
        helpfulnessVotes:
          type: integer
        helpfulPositive:
          type: integer
        isInstalled:
          type: boolean
        itemId:
          type: [string, 'null']
        itemVersion:
          type: string
        locale:
          type: [string, 'null']
        rating:
          type: integer
        reviewerId:
          type: [string, 'null']
        reviewId:
          type: [string, 'null']
        reviewText:
          type: string
        submitted:
          type: string
          format: date-time
        title:
          type: string
        reviewerName:
          type: string
        avatarUrl:
          type: string

    ReviewsResponse:
      type: object
      properties:
        continuationToken:
          type: [string, 'null']
          description: Always null.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        totalCount:
          type: [integer, 'null']
          description: Null when the mod has no reviews.
      required: [continuationToken, reviews, totalCount]

    PollSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: integer
        created:
          type: string
          format: date-time
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        expireDateTime:
          type: string
          format: date-time
        metadata:
          type: string
        icon:
          type: [string, 'null']

    PollList:
      type: array
      items:
        $ref: '#/components/schemas/PollSummary'

    PollOption:
      type: object
      properties:
        id:
          type: integer
        value:
          type: string
        voteCount:
          type: integer
        userVote:
          type: boolean

    PollQuestion:
      type: object
      properties:
        id:
          type: integer
        order:
          type: integer
        content:
          type: string
        type:
          type: string
          enum: [multiple-choice, text]
        maxOptions:
          type: integer
        userVoted:
          type: boolean
        totalVotes:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/PollOption'

    Poll:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pollId:
          type: string
          format: uuid
          description: Same value as id.
        gameId:
          type: integer
        createdBy:
          type: string
        created:
          type: string
          format: date-time
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        expireDateTime:
          type: string
          format: date-time
        metadata:
          type: string
        isDefinition:
          type: boolean
        totalVotes:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PollQuestion'

    MatchContentUploadResponse:
      type: object
      properties:
        isError:
          type: boolean
          examples: [false]

    MatchContentFile:
      type: object
      properties:
        fileName:
          type: string
        fileSize:
          type: integer
        filePath:
          type: string
          format: uri
          description: Absolute URL of the payload route, including the MD5 digest.
        fileCRC:
          type: string

    MatchContentMetadataResponse:
      type: object
      properties:
        isError:
          type: boolean
        fileList:
          type: array
          items:
            $ref: '#/components/schemas/MatchContentFile'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    # Moderation schemas
    TextModerationRequest:
      type: object
      required:
        - conversationId
        - textContent
        - language
        - textType
      properties:
        conversationId:
          type: string
        textContent:
          type: string
        language:
          type: string
        textType:
          type: string
          enum: [SanitisationUsername, SanitisationInput]
        includeResponse:
          type: boolean
          default: false

    TextModerationResponse:
      type: object
      description: |
        The observed answer: every result is Allow and translationAvailable is
        false. The captures answer Allow for every input, so no policy engine
        is modelled.
      properties:
        filterResult:
          type: string
          enum: [Allow, Block, Review]
          examples: [Allow]
        familyFriendlyResult:
          type: string
          enum: [Allow, Block, Review]
          examples: [Allow]
        mediumResult:
          type: string
          enum: [Allow, Block, Review]
          examples: [Allow]
        matureResult:
          type: string
          enum: [Allow, Block, Review]
          examples: [Allow]
        maturePlusResult:
          type: string
          enum: [Allow, Block, Review]
          examples: [Allow]
        translationAvailable:
          type: boolean
          examples: [false]
        moderatedText:
          type: string
          description: Echo of the request textContent.
        language:
          type: string
          description: |
            The detected language, not the echo of the request: "Test Mod"
            answers "en" even when the input language is "es-ES". The base
            subtag of the input tag is the deterministic stand-in.
      required: [filterResult, familyFriendlyResult, mediumResult, matureResult, maturePlusResult, translationAvailable, moderatedText, language]

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: integer
          description: |
            Not an HTTP status: 400 for a bad request, 900 for an
            unauthenticated request, 404 for a missing resource, 429 for the
            MatchContent rate limit and 500 for an internal error.
        errorMessage:
          type: string
        isLoggedOn:
          type: boolean
          description: Only the 401 carries it (false); the other errors omit it.
      required: [errorCode, errorMessage]

    ProblemDetails:
      type: object
      description: |
        RFC 9110 body the v4 Detail answers with when the mod does not exist.
        traceId is a W3C trace id: two 16-byte and 8-byte random groups between
        the version and flag bytes.
      properties:
        type:
          type: string
          format: uri
          description: Link to the RFC 9110 section of the status.
        title:
          type: string
        status:
          type: integer
        traceId:
          type: string

    # Legacy (v1) schemas. The v1 surface renders the same mods with a different
