        modDescription:
          type: [string, 'null']
        changeList:
          type: [string, 'null']
          description: Always null in a v1 list.
        modVersion:
          type: number
          description: As stored; the v1 surface applies no 1.1 default.
        verifiedVersion:
          type: [string, 'null']
        modTypeId:
          type: [integer, 'null']
          description: Always null in the v1 render.
        clientId:
          type: [string, 'null']
          description: Always null in the v1 render.
        modType:
          type: [string, 'null']
        modTags:
          type: array
          items:
            type: string
          description: The tag ids rendered as strings.
        modTagIds:
          type: [array, 'null']
          items:
            type: integer
          description: Always null; the ids live in modTags.
        modTagNames:
          type: [array, 'null']
          items:
            type: string
        metaData:
          type: 'null'
          description: Always null in a v1 list.
        modStatusId:
          type: [integer, 'null']
          description: Always null in a v1 list.
        modStatus:
          type: [string, 'null']
        modStatusMessage:
          type: [string, 'null']
          description: Always null in the v1 render.
        modVisibility:
          type: [string, 'null']
        creatorId:
          type: [integer, 'null']
          description: Always null in the v1 render.
        creatorName:
          type: [string, 'null']
        creatorAvatarUrl:
          type: [string, 'null']
        isOwner:
          type: boolean
        isLoggedOn:
          type: boolean
        allowDiscussion:
          type: boolean
        discourseUrl:
          type: [string, 'null']
        createDate:
          type: string
          format: date-time
        lastUpdate:
          type: string
          format: date-time
        updateAvailable:
          type: boolean
        modFileSize:
          type: [number, 'null']
        modDiskSize:
          type: [number, 'null']
          description: Always null in a v1 list.
        popular:
          type: [integer, 'null']
          description: Always null in a v1 list.
        downloads:
          type: [integer, 'null']
        installs:
          type: [integer, 'null']
        likes:
          type: [integer, 'null']
        userLiked:
          type: [boolean, 'null']
        ratings:
