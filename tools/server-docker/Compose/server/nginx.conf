# Reverse proxy for the compose service (the upstream host is the service name).
# Without the per-location body sizes nginx answers 413 long before the server
# sees a mod: its default is 1 MiB.
server {
    listen 80;
    server_name _;

    # AOE4 uploads its .sga as 512 MiB blocks (CheckAndPublishFile).
    location /api/v4/mods/checkandpublishfile {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://server:8080;
    }

    # Publish (v4) and Create (v1) carry a .zip of up to 1 GiB plus framing.
    location ~* ^/api/(v4/mods/publish|v1/mods/create)/?$ {
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://server:8080;
    }

    # MatchContent savegames and replays: 32 MiB plus slack.
    location /api/matchcontent {
        client_max_body_size 36m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://server:8080;
    }

    location / {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        # Absolute URLs (downloadUrl, imageThumbnail, filePath) are built from
        # these; nothing here authenticates anything.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
